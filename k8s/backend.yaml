apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-backend
  namespace: chatbot
spec:
  replicas: 2
  selector:
    matchLabels: { app: chatbot-backend }
  template:
    metadata:
      labels: { app: chatbot-backend }
    spec:
      containers:
      - name: api
        image: YOUR_DOCKERHUB_OR_ECR/chatbot-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: OPENAI_API_KEY
          valueFrom: { secretKeyRef: { name: chatbot-secrets, key: OPENAI_API_KEY } }
        - name: MONGODB_URI
          valueFrom: { secretKeyRef: { name: chatbot-secrets, key: MONGODB_URI } }
        - name: MONGODB_DB
          valueFrom: { configMapKeyRef: { name: chatbot-config, key: MONGODB_DB } }
        - name: OPENAI_MODEL
          valueFrom: { configMapKeyRef: { name: chatbot-config, key: OPENAI_MODEL } }
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-backend
  namespace: chatbot
spec:
  selector: { app: chatbot-backend }
  ports:
  - name: http
    port: 80
    targetPort: 8080

