apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-frontend
  namespace: chatbot
spec:
  replicas: 2
  selector:
    matchLabels: { app: chatbot-frontend }
  template:
    metadata:
      labels: { app: chatbot-frontend }
    spec:
      containers:
      - name: web
        image: YOUR_DOCKERHUB_OR_ECR/chatbot-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-frontend
  namespace: chatbot
spec:
  selector: { app: chatbot-frontend }
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: LoadBalancer   # or ClusterIP if using Ingress

